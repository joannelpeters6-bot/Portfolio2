<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact</title>

<style type="text/css">
    html {
        margin: 0;
        padding: 0;
    }
    body {
        width: 90%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 50px 50px;
        font-family: Georgia, 'Times New Roman', Times, serif;
        color: black;
        background: white;
        box-sizing: border-box;
    }

    /* ---------- Nav bar (matches Resume / About me pages) ---------- */
    #div0 {
        width: 100%;
        display: flex;
        justify-content: center;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    }
    th { padding: 15px; }
    .home, .resume, .contact {
        padding: 2px 50px;
        font-family: 'Courier New', Courier, monospace;
        color: black;
        cursor: pointer;
        transition: all 1s ease-in-out;
    }
    .home:hover, .resume:hover, .contact:hover {
        background: black;
        color: white;
    }

    /* ---------- Header ---------- */
    .intro {
        text-align: center;
        margin: 50px 0 40px;
    }
    .intro h1 {
        margin: 0 0 10px;
        letter-spacing: 1px;
    }
    .intro p {
        font-family: 'Courier New', Courier, monospace;
        margin: 0;
        font-size: 15px;
    }
    .sparkle {
        display: inline-block;
        margin: 0 6px;
        animation: twinkleLoop 1.4s ease-in-out infinite;
    }
    @keyframes twinkleLoop {
        0%   { opacity: 0; transform: scale(0.2) rotate(0deg); }
        50%  { opacity: 1; transform: scale(1.3) rotate(180deg); }
        100% { opacity: 0; transform: scale(0.2) rotate(360deg); }
    }

    /* ---------- Contact cards ---------- */
    .cards {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 30px;
    }
    .card {
        width: 260px;
        padding: 30px 20px;
        border: 2px solid black;
        text-align: center;
        background: white;
        box-shadow: 6px 6px 0 black;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        /* start hidden; JS fades each card in */
        opacity: 0;
        transform: translateY(30px);
    }
    .card.show {
        opacity: 1;
        transform: translateY(0);
    }
    .card.show:hover {
        transform: translate(-4px, -4px);
        box-shadow: 10px 10px 0 black;
    }
    .card svg {
        width: 44px;
        height: 44px;
        margin-bottom: 10px;
        transition: transform 0.5s ease;
    }
    .card:hover svg {
        transform: rotate(-10deg) scale(1.15);
    }
    .card h2 {
        font-variant: small-caps;
        letter-spacing: 1mm;
        margin: 0 0 8px;
        font-size: 20px;
    }
    .card .value {
        font-family: 'Courier New', Courier, monospace;
        font-size: 14px;
        margin: 0 0 20px;
        word-break: break-word;
    }
    .actions {
        display: flex;
        justify-content: center;
        gap: 10px;
    }
    .btn {
        font-family: 'Courier New', Courier, monospace;
        font-size: 14px;
        padding: 8px 14px;
        border: 2px solid black;
        background: white;
        color: black;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.3s, color 0.3s;
    }
    .btn:hover, .btn:focus-visible {
        background: black;
        color: white;
        outline: none;
    }

    /* ---------- "Copied!" toast ---------- */
    #toast {
        position: fixed;
        left: 50%;
        bottom: 30px;
        transform: translateX(-50%) translateY(100px);
        background: black;
        color: white;
        font-family: 'Courier New', Courier, monospace;
        padding: 12px 24px;
        transition: transform 0.4s ease;
        pointer-events: none;
    }
    #toast.visible {
        transform: translateX(-50%) translateY(0);
    }

    .footer-note {
        text-align: center;
        margin-top: 50px;
        font-size: 13px;
        font-family: 'Courier New', Courier, monospace;
    }

    /* ---------- Phones ---------- */
    @media (max-width: 600px) {
        body { width: 100%; padding: 0 16px 40px; }
        .home, .resume, .contact { padding: 2px 12px; }
        th { padding: 10px 4px; }
        .card { width: 100%; }
    }
</style>
</head>

<body>
    <div id="div0">
        <table>
            <tr>
                <th><a href="index.html"><button class="home">Home</button></a></th>
                <th><a href="Resume.html"><button class="resume">Recruiter View</button></a></th>
                <th><a href="contact.html"><button class="contact">Contact</button></a></th>
            </tr>
        </table>
    </div>

    <div class="intro">
        <h1>Let's Connect</h1>
        <p><span class="sparkle">✦</span>Open to full time Data Analyst roles &mdash; remote / hybrid / in office<span class="sparkle">✦</span></p>
    </div>

    <div class="cards">
        <!-- LinkedIn -->
        <div class="card">
            <svg viewBox="0 0 24 24" fill="black" aria-hidden="true">
                <path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/>
            </svg>
            <h2>LinkedIn</h2>
            <p class="value">joanne-peters</p>
            <div class="actions">
                <a class="btn" href="https://www.linkedin.com/in/joanne-peters-3b52bb193/" target="_blank" rel="noopener">View Profile</a>
            </div>
        </div>

        <!-- Email -->
        <div class="card">
            <svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" aria-hidden="true">
                <rect x="2" y="4" width="20" height="16" rx="1"/>
                <path d="M2 5l10 8 10-8"/>
            </svg>
            <h2>Email</h2>
            <p class="value">joannelpeters6@gmail.com</p>
            <div class="actions">
                <a class="btn" href="mailto:joannelpeters6@gmail.com?subject=Opportunity%20for%20JoAnne%20Peters">Send</a>
                <button class="btn copy" data-copy="joannelpeters6@gmail.com">Copy</button>
            </div>
        </div>

        <!-- Phone -->
        <div class="card">
            <svg viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" aria-hidden="true">
                <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>
            </svg>
            <h2>Phone</h2>
            <p class="value">+1 (417) 705-8883</p>
            <div class="actions">
                <a class="btn" href="tel:+14177058883">Call</a>
                <button class="btn copy" data-copy="+1 417-705-8883">Copy</button>
            </div>
        </div>
    </div>

    <p class="footer-note">I typically respond within one business day.</p>

    <div id="toast" role="status" aria-live="polite"></div>

<script>
    // 1. Fade the cards in one after another when the page loads
    const cards = document.querySelectorAll('.card');
    cards.forEach(function (card, i) {
        setTimeout(function () {
            card.classList.add('show');
        }, 200 + i * 200);
    });

    // 2. Show a small message at the bottom of the screen
    const toast = document.getElementById('toast');
    let toastTimer;
    function showToast(message) {
        toast.textContent = message;
        toast.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
            toast.classList.remove('visible');
        }, 2000);
    }

    // 3. "Copy" buttons put the email / phone on the clipboard
    document.querySelectorAll('.copy').forEach(function (button) {
        button.addEventListener('click', function () {
            const text = button.dataset.copy;
            navigator.clipboard.writeText(text)
                .then(function () {
                    showToast('Copied: ' + text);
                    button.textContent = 'Copied!';
                    setTimeout(function () { button.textContent = 'Copy'; }, 1500);
                })
                .catch(function () {
                    showToast('Copy failed - please select the text instead');
                });
        });
    });
</script>
</body>
</html>

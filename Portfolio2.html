 </div>

<style type="text/css">

   
    body{
        cursor: crosshair;
        min-height: 100vh;
        margin: 0;
    }

    .front-text{
        font-family: 'Times New Roman', Times, serif;
        letter-spacing: -1px;
        color: black;
        text-align: center;
        font-size: 90px;      
        transition-duration: 1s;
        position:absolute;
        top: 50%;
        left: 50%;
        z-index: 1;
        display: inline-block;
        transition: color 1s ease-in-out;
        white-space: nowrap;
        transform: translate(-50%, -50%)
    

        
    }
    .front-text::after{
        content: attr(data-hover);
        position: absolute;
        color: black;
        font-size: 30px;
        left: 0;
        top: 0;
        padding-top: 10mm;
        opacity: 0;    
        transition: opacity 1s ease-in-out;
    }
    .front-text:hover{
        color: rgba(0, 0, 0, 0);
        cursor: pointer;
     
    }

    .front-text:hover::after{
        opacity: 1;
    }
    .corner{
        position: fixed;
        font-family:'Courier New', Courier, monospace;
        font-size: 30px;
        color: rgb(51, 50, 50);
        z-index: 10;
        padding: 17px;
    }

    .topl-role{
        top: 0;
        left: 0;
    }
    .topr-location{
        top: 0;
        right: 0;
    }
    .bottoml-resume{
        bottom: 0;
        left: 0;
    }
    .bottomr-contact{
        bottom: 0;
        right: 0;
    }
    .sparkle{
        display: inline-block;
        font-size: 14px;
        color: black;
        opacity: 0;
        margin-left: 5px;
        transform: scale(0) rotate(0deg);
        transition: all 0.3s ease-in-out;
        vertical-align: middle;
    }
    .corner:hover .sparkle{
        animation: twinkleLoop 1.4s infinite ease-in-out;
    }
       @keyframes twinkleLoop {
    0% {
        opacity: 0;
        transform: scale(0.2) rotate(0deg);
    }
    50% {
        opacity: 1;
        transform: scale(1.3) rotate(180deg);
        /* Gives it a crisp, elegant neon text reflection */
        text-shadow: 0 0 8px rgba(0, 0, 0, 0.3); 
    }
    100% {
        opacity: 0;
        transform: scale(0.2) rotate(360deg);
    }
    }
    a:link {
        color:black;
        text-decoration: none;
    }
    a:visited {
        color: black;
        text-decoration: none;

    }

    



</style>
